[package]
name = "verdant"
version = "1.0.0"
description = "Keep your NVIDIA GeForce driver up to date."
authors = ["Patrick"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "process", "macros"] }
futures-util = "0.3"
regex = "1"
urlencoding = "2"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

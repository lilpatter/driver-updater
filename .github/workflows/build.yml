name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The app compares this with the build number in the latest release's tag to update itself.
      - name: Build app and installer
        run: cargo tauri build
        env:
          VERDANT_BUILD: ${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: verdant-windows
          path: |
            src-tauri/target/release/verdant.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Tags like v1.2.0 publish under that tag; pushes to main publish v<app version>-build.<run>.
      - name: Choose release tag
        id: tag
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            $name = "Verdant $($tag.TrimStart('v'))"
          } else {
            $tag = "v$version-build.$env:GITHUB_RUN_NUMBER"
            $name = "Verdant $version (build $env:GITHUB_RUN_NUMBER)"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            src-tauri/target/release/verdant.exe
            src-tauri/target/release/bundle/nsis/*.exe

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verdant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="titlebar" data-tauri-drag-region>
        <div class="lights">
          <button class="light close" data-action="win-close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5"/></svg></button>
          <button class="light min" data-action="win-min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M3 6h6"/></svg></button>
          <button class="light max" data-action="win-max" aria-label="Zoom"><svg viewBox="0 0 12 12"><path d="M6 3v6M3 6h6"/></svg></button>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a data-page="search"><i data-icon="search"></i><span>Search</span></a>
        <a data-page="home"><i data-icon="home"></i><span>Home</span><b class="dot" id="home-dot" hidden></b></a>
        <div class="nav-section">Library</div>
        <a data-page="downloads"><i data-icon="download"></i><span>Downloads</span><b class="count" id="dl-badge" hidden></b></a>
        <a data-page="gameready"><i data-icon="gamepad"></i><span>Game Ready</span></a>
        <a data-page="studio"><i data-icon="brush"></i><span>Studio</span></a>
        <a data-page="gpu"><i data-icon="cpu"></i><span>My GPU</span></a>
        <a data-page="settings"><i data-icon="gear"></i><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="round-btn" data-action="refresh" id="refresh-btn" aria-label="Check for updates" title="Check for updates (Ctrl+R)"><i data-icon="refresh"></i></button>
        <div class="me" id="me"></div>
      </div>
    </aside>
    <main class="content" id="content">
      <div class="content-drag" data-tauri-drag-region></div>
      <div id="banner"></div>
      <div id="page"></div>
    </main>
  </div>
  <div class="sheet-backdrop" id="sheet" hidden></div>
  <script src="app.js"></script>
</body>
</html>
